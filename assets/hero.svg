<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="650"
     viewBox="0 0 1200 650">

  <defs>

    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="50%" stop-color="#10182B"/>
      <stop offset="100%" stop-color="#080B12"/>
    </linearGradient>

    <!-- Name -->
    <linearGradient id="nameGradient" x1="0" x2="1">
      <stop offset="0%" stop-color="#61DAFB"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Card -->
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172033"/>
      <stop offset="100%" stop-color="#0D1320"/>
    </linearGradient>

    <!-- Scanner -->
    <linearGradient id="scanner">
      <stop offset="0%" stop-color="#61DAFB" stop-opacity="0"/>
      <stop offset="50%" stop-color="#61DAFB" stop-opacity="1"/>
      <stop offset="100%" stop-color="#61DAFB" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Rounded clipping -->
    <clipPath id="clip">
      <rect width="1200" height="650" rx="30"/>
    </clipPath>

  </defs>


  <!-- =====================================================
       BACKGROUND
  ====================================================== -->

  <rect
    width="1200"
    height="650"
    rx="30"
    fill="url(#bg)"
  />


  <!-- =====================================================
       GRID
  ====================================================== -->

  <g
    stroke="#64748B"
    stroke-width="1"
    opacity=".08">

    <path d="M0 100H1200"/>
    <path d="M0 200H1200"/>
    <path d="M0 300H1200"/>
    <path d="M0 400H1200"/>
    <path d="M0 500H1200"/>
    <path d="M0 600H1200"/>

    <path d="M100 0V650"/>
    <path d="M200 0V650"/>
    <path d="M300 0V650"/>
    <path d="M400 0V650"/>
    <path d="M500 0V650"/>
    <path d="M600 0V650"/>
    <path d="M700 0V650"/>
    <path d="M800 0V650"/>
    <path d="M900 0V650"/>
    <path d="M1000 0V650"/>
    <path d="M1100 0V650"/>

  </g>


  <!-- =====================================================
       TERMINAL
  ====================================================== -->

  <g font-family="monospace">

    <text
      x="60"
      y="65"
      font-size="20"
      fill="#61DAFB">

      jali@frontend:~$

    </text>

    <text
      x="280"
      y="65"
      font-size="20"
      fill="#E2E8F0"
      opacity="0">

      whoami

      <animate
        attributeName="opacity"
        from="0"
        to="1"
        dur="1s"
        begin="1s"
        fill="freeze"/>

    </text>

    <!-- Blinking cursor -->

    <rect
      x="365"
      y="45"
      width="9"
      height="25"
      fill="#61DAFB">

      <animate
        attributeName="opacity"
        values="1;0;1"
        dur="1s"
        repeatCount="indefinite"/>

    </rect>

  </g>


  <!-- =====================================================
       NAME
  ====================================================== -->

  <text
    x="60"
    y="150"
    font-family="Arial, Helvetica, sans-serif"
    font-size="68"
    font-weight="700"
    fill="url(#nameGradient)"
    opacity="0">

    JALI KAR

    <animate
      attributeName="opacity"
      from="0"
      to="1"
      dur="1s"
      begin="2s"
      fill="freeze"/>

    <animate
      attributeName="x"
      values="30;60"
      dur="1s"
      begin="2s"
      fill="freeze"/>

  </text>


  <!-- =====================================================
       ROLE
  ====================================================== -->

  <text
    x="64"
    y="195"
    font-family="Arial, Helvetica, sans-serif"
    font-size="25"
    fill="#E2E8F0"
    opacity="0">

    SENIOR FRONTEND DEVELOPER

    <animate
      attributeName="opacity"
      from="0"
      to="1"
      dur="1s"
      begin="2.8s"
      fill="freeze"/>

  </text>


  <!-- =====================================================
       DESCRIPTION
  ====================================================== -->

  <text
    x="64"
    y="235"
    font-family="Arial, Helvetica, sans-serif"
    font-size="17"
    fill="#94A3B8"
    opacity="0">

    Building scalable enterprise frontend applications.

    <animate
      attributeName="opacity"
      from="0"
      to="1"
      dur="1s"
      begin="3.4s"
      fill="freeze"/>

  </text>


  <!-- =====================================================
       TECHNOLOGY PILLS
  ====================================================== -->

  <g
    font-family="Arial, Helvetica, sans-serif"
    font-size="14">

    <!-- Angular -->

    <rect
      x="60"
      y="270"
      width="110"
      height="38"
      rx="19"
      fill="#172033"
      stroke="#DD0031"
      opacity="0">

      <animate
        attributeName="opacity"
        from="0"
        to="1"
        dur=".5s"
        begin="4s"
        fill="freeze"/>

    </rect>

    <text
      x="115"
      y="294"
      text-anchor="middle"
      fill="#FCA5A5">

      Angular

    </text>


    <!-- TypeScript -->

    <rect
      x="180"
      y="270"
      width="125"
      height="38"
      rx="19"
      fill="#172033"
      stroke="#3178C6"
      opacity="0">

      <animate
        attributeName="opacity"
        from="0"
        to="1"
        dur=".5s"
        begin="4.2s"
        fill="freeze"/>

    </rect>

    <text
      x="242"
      y="294"
      text-anchor="middle"
      fill="#93C5FD">

      TypeScript

    </text>


    <!-- JavaScript -->

    <rect
      x="315"
      y="270"
      width="125"
      height="38"
      rx="19"
      fill="#172033"
      stroke="#F7DF1E"
      opacity="0">

      <animate
        attributeName="opacity"
        from="0"
        to="1"
        dur=".5s"
        begin="4.4s"
        fill="freeze"/>

    </rect>

    <text
      x="377"
      y="294"
      text-anchor="middle"
      fill="#FDE68A">

      JavaScript

    </text>


    <!-- RxJS -->

    <rect
      x="450"
      y="270"
      width="95"
      height="38"
      rx="19"
      fill="#172033"
      stroke="#B91C1C"
      opacity="0">

      <animate
        attributeName="opacity"
        from="0"
        to="1"
        dur=".5s"
        begin="4.6s"
        fill="freeze"/>

    </rect>

    <text
      x="497"
      y="294"
      text-anchor="middle"
      fill="#FCA5A5">

      RxJS

    </text>


    <!-- SAP -->

    <rect
      x="555"
      y="270"
      width="145"
      height="38"
      rx="19"
      fill="#172033"
      stroke="#38BDF8"
      opacity="0">

      <animate
        attributeName="opacity"
        from="0"
        to="1"
        dur=".5s"
        begin="4.8s"
        fill="freeze"/>

    </rect>

    <text
      x="627"
      y="294"
      text-anchor="middle"
      fill="#7DD3FC">

      SAP Spartacus

    </text>

  </g>


  <!-- =====================================================
       ARCHITECTURE CARD
  ====================================================== -->

  <rect
    x="60"
    y="345"
    width="640"
    height="220"
    rx="20"
    fill="url(#glass)"
    stroke="#26354F"
    opacity="0">

    <animate
      attributeName="opacity"
      from="0"
      to="1"
      dur="1s"
      begin="5.2s"
      fill="freeze"/>

  </rect>


  <text
    x="90"
    y="385"
    font-family="monospace"
    font-size="16"
    fill="#61DAFB">

    &gt; FRONTEND ARCHITECTURE

  </text>


  <g
    font-family="Arial, Helvetica, sans-serif"
    font-size="14"
    fill="#E2E8F0">

    <text x="90" y="425">
      UI
    </text>

    <text x="150" y="425">
      →
    </text>

    <text x="180" y="425">
      Components
    </text>

    <text x="300" y="425">
      →
    </text>

    <text x="330" y="425">
      Facade
    </text>

    <text x="410" y="425">
      →
    </text>

    <text x="440" y="425">
      State
    </text>

    <text x="510" y="425">
      →
    </text>

    <text x="540" y="425">
      API
    </text>

  </g>


  <line
    x1="90"
    y1="445"
    x2="650"
    y2="445"
    stroke="#334155"/>


  <text
    x="90"
    y="480"
    font-family="monospace"
    font-size="14"
    fill="#94A3B8">

    Reusable Components

  </text>


  <text
    x="90"
    y="505"
    font-family="monospace"
    font-size="14"
    fill="#94A3B8">

    State Management

  </text>


  <text
    x="90"
    y="530"
    font-family="monospace"
    font-size="14"
    fill="#94A3B8">

    API Integration

  </text>


  <!-- Online indicator -->

  <circle
    cx="620"
    cy="520"
    r="5"
    fill="#22C55E"
    filter="url(#glow)">

    <animate
      attributeName="opacity"
      values=".3;1;.3"
      dur="2s"
      repeatCount="indefinite"/>

  </circle>


  <!-- =====================================================
       DEVELOPER CARD
  ====================================================== -->

  <rect
    x="735"
    y="110"
    width="405"
    height="455"
    rx="24"
    fill="#0B1220"
    stroke="#26354F"/>


  <!-- Avatar circle -->

  <circle
    cx="937"
    cy="240"
    r="105"
    fill="#111C30"
    stroke="#61DAFB"
    stroke-width="2">

    <animate
      attributeName="r"
      values="100;108;100"
      dur="3s"
      repeatCount="indefinite"/>

  </circle>


  <!-- Simple developer icon -->

  <circle
    cx="937"
    cy="220"
    r="42"
    fill="#1E293B"
    stroke="#8B5CF6"
    stroke-width="2"/>


  <path
    d="M900 290 Q937 255 974 290"
    fill="none"
    stroke="#8B5CF6"
    stroke-width="10"
    stroke-linecap="round"/>


  <!-- Developer name -->

  <text
    x="937"
    y="390"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="25"
    font-weight="700"
    fill="#F8FAFC">

    JALI KAR

  </text>


  <text
    x="937"
    y="420"
    text-anchor="middle"
    font-family="monospace"
    font-size="14"
    fill="#61DAFB">

    SENIOR FRONTEND ENGINEER

  </text>


  <text
    x="937"
    y="460"
    text-anchor="middle"
    font-family="monospace"
    font-size="13"
    fill="#64748B">

    BUILD • ARCHITECT • LEARN

  </text>


  <!-- Status -->

  <circle
    cx="825"
    cy="505"
    r="5"
    fill="#22C55E"
    filter="url(#glow)"/>


  <text
    x="840"
    y="510"
    font-family="monospace"
    font-size="13"
    fill="#94A3B8">

    SYSTEM ONLINE

  </text>


  <!-- =====================================================
       SCANNER
  ====================================================== -->

  <g clip-path="url(#clip)">

    <rect
      x="0"
      y="-10"
      width="1200"
      height="4"
      fill="url(#scanner)"
      filter="url(#glow)">

      <animate
        attributeName="y"
        from="-10"
        to="650"
        dur="3.5s"
        begin="6s"
        repeatCount="indefinite"/>

    </rect>

  </g>


  <!-- =====================================================
       FOOTER
  ====================================================== -->

  <text
    x="60"
    y="610"
    font-family="monospace"
    font-size="13"
    fill="#475569">

    jali@frontend:~$ build --scalable --accessible --maintainable

  </text>


</svg>
